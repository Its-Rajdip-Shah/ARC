name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arc_ci
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc -d arc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://arc:arc_ci_password@localhost:5432/arc_ci
      SECRET_KEY: ci-only-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      ENABLE_DJANGO_ADMIN: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff

      - name: Generate test encryption key
        run: |
          echo "ARC_FIELD_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Lint Python code
        run: ruff check backend --select E4,E7,E9,F63,F7,F82

      - name: Check Django configuration
        working-directory: backend
        run: python manage.py check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest